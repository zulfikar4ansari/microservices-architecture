version: '3.8'

services:

  discovery-server:
      build:            
        context: ./discovery-server
        dockerfile: Dockerfile        #docker file should be there in project source path. generate jar file prior using "mvn clean package  /  mvn clean package -DskipTests"
      container_name: discovery-server
      ports:
        - "8761:8761"
            
  # =========================================================
  # 🔹 MONGODB
  # =========================================================
  mongo1:
    image: mongo:6
    container_name: mongo1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # =========================================================
  # 🔹 POSTGRESQL (ENV-BASED CREDENTIALS)
  # =========================================================
  postgres-master:
    image: bitnami/postgresql:latest
    container_name: postgres-master
    environment:
      - POSTGRESQL_DATABASE=orderdb
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/bitnami/postgresql

  # =========================================================
  # 🔹 REDIS
  # =========================================================
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  # =========================================================
  # 🔹 KAFKA (KRaft - NO Zookeeper)
  # =========================================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

  # =========================================================
  # 🔹 CONFIG SERVER
  # =========================================================
  config-server:
    build: ./config-server            #docker file should be there in project source path. generate jar file prior using "mvn clean package  /  mvn clean package -DskipTests"
    container_name: config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo   # Mount config repo inside container

  # =========================================================
  # 🔹 PRODUCT SERVICE
  # =========================================================
  product-service:
    build: ./product-service          #docker file should be there in project source path. generate jar file prior using "mvn clean package  /  mvn clean package -DskipTests"
    container_name: product-service
    depends_on:
      - mongo1
      - config-server
    ports:
      - "8081:8081"

  # =========================================================
  # 🔹 ORDER SERVICE
  # =========================================================
  order-service:
    build: ./order-service            #docker file should be there in project source path. generate jar file prior using "mvn clean package  /  mvn clean package -DskipTests"
    container_name: order-service
    depends_on:
      - postgres-master
      - kafka
      - config-server
    environment:
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    ports:
      - "8082:8082"

# =========================================================
# 🔹 VOLUMES (PERSISTENCE)
# =========================================================
volumes:
  mongo_data:
  postgres_data:
 













